<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paperfold — Pricing</title>
    <style>
      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        color: #11161c;
        background: #ffffff;
        line-height: 1.5;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 24px;
      }
      .plan {
        margin-top: 24px;
      }
      .price {
        font-size: 32px;
        font-weight: 700;
        color: #1f6feb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Simple pricing</h1>
      <div class="plan">
        <h2>Free</h2>
        <p class="price">$0</p>
        <p>Your first 5 invoices every month. No card needed.</p>
      </div>
      <div class="plan">
        <h2>Pro</h2>
        <p class="price">$12 a month</p>
        <p>Unlimited invoices, automatic reminders, and your own branding.</p>
      </div>
      <p><a href="/">Back to home</a></p>
    </main>
  </body>
</html>
