<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paperfold — Features</title>
    <style>
      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        color: #11161c;
        background: #ffffff;
        line-height: 1.5;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 24px;
      }
      figure {
        margin: 24px 0;
      }
      .mock {
        border: 1px solid #e3e8ef;
        border-radius: 10px;
        padding: 16px;
        color: #5a6572;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Features</h1>
      <ul>
        <li>Turn plain notes into a formatted invoice.</li>
        <li>Automatic payment reminders.</li>
        <li>Stripe, Wise, and PayPal payouts.</li>
      </ul>

      <figure>
        <div class="mock" role="img" aria-label="Paperfold dashboard screenshot">
          <p>Invoice #1042 — Acme Inc — $4,200.00 — Paid</p>
          <p>Invoice #1043 — Globex — $1,750.00 — Due</p>
          <p>This month: $18,950.00 collected</p>
        </div>
        <figcaption>A sample dashboard. Figures here are illustrative demo data.</figcaption>
      </figure>

      <p><a href="/">Back to home</a></p>
    </main>
  </body>
</html>
